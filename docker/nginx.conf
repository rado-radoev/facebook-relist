server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + live-view WebSocket: the app calls the backend at the SAME
    # origin (relative /api/... paths), so the web image must forward
    # them to the backend service over the compose network. Without
    # this block, /api/... falls through to the SPA fallback and returns
    # index.html with HTTP 200 — sign-in can never complete.
    # proxy_pass has no URI part, so the /api/... path reaches the
    # backend unchanged (all backend routes live under /api/).
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;

        # WebSocket upgrade — the Facebook live view runs over
        # ws/wss at /api/facebook/view.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The live-view socket is long-lived; the 60s default would cut
        # it while the owner is still reading Facebook's login page.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: every path that is not a real file returns the app,
    # so client-side routes survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
